<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --a:var(--lp1,#19e6b4);--b:var(--lp2,#2f8bff);--a-rgb:var(--lp1-rgb,25,230,180);--b-rgb:var(--lp2-rgb,47,139,255);
  --bg1:#031512;--bg2:#020b12;--bg3:#04161c;
  --card1:rgba(6,40,40,.88);--card2:rgba(3,15,20,.94);
  --text:#ffffff;--muted:#9bc4bf;--faint:#7aa6a2;
  --line:rgba(var(--a-rgb),.35);--tile:rgba(255,255,255,.04);
  --badge:#c8fff0;--btn-text:var(--lp-on,#02130f);--ico:#0c2b30;--ico2:#06161a;--ring:#fff
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg1:#e9fbf6;--bg2:#eaf3ff;--bg3:#f2fffb;
    --card1:rgba(255,255,255,.92);--card2:rgba(240,252,249,.96);
    --text:#06231f;--muted:#3d6661;--faint:#4f7571;
    --line:rgba(10,140,110,.4);--tile:rgba(10,160,125,.07);--badge:#05604c;--ico:#e6fbf5;--ico2:#cdf3ea;--ring:#fff
  }
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;min-height:100svh;display:flex;justify-content:center;align-items:center;
  color:var(--text);overflow-x:hidden;
  padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  background:radial-gradient(circle at 12% 12%,rgba(var(--a-rgb),.2),transparent 30%),
             radial-gradient(circle at 92% 85%,rgba(var(--b-rgb),.18),transparent 32%),
             linear-gradient(145deg,var(--bg1),var(--bg2) 55%,var(--bg3));
}
body:before,body:after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none;animation:orb 8s ease-in-out infinite alternate}
body:before{background:var(--a);left:-110px;top:8%}
body:after{background:var(--b);right:-120px;bottom:5%;animation-delay:-4s}
@keyframes orb{to{transform:translate(25px,-20px) scale(1.12)}}
.container{
  max-width:440px;width:100%;position:relative;overflow:hidden;text-align:center;padding:30px 22px 25px;
  border-radius:30px;border:1px solid var(--line);
  background:linear-gradient(145deg,var(--card1),var(--card2));
  box-shadow:0 30px 90px rgba(0,0,0,.35),0 0 70px rgba(var(--a-rgb),.1);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);animation:cardIn .75s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
.badge{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:8px 16px;margin-bottom:20px;border-radius:999px;
  color:var(--badge);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  background:rgba(var(--a-rgb),.1);border:1px solid var(--line)}
.badge:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
.icon{position:relative;width:118px;height:118px;margin:2px auto 21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:50px;font-weight:900;color:var(--a);background:radial-gradient(circle,var(--ico) 48%,var(--ico2) 49%);border:4px solid var(--ring);
  outline:4px solid rgba(var(--a-rgb),.6);box-shadow:0 0 0 10px rgba(var(--a-rgb),.08),0 0 38px rgba(var(--a-rgb),.5);
  animation:logoFloat 3s ease-in-out infinite}
.icon:before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(var(--a-rgb),.25);animation:ring 2.5s linear infinite}
.icon img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:76% 28%}
img[src=""]{display:none}
@keyframes logoFloat{50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes ring{from{transform:scale(.94);opacity:.8}to{transform:scale(1.08);opacity:0}}
h1{font-size:clamp(25px,7.6vw,32px);line-height:1.1;font-weight:900;letter-spacing:-1.1px;margin-bottom:22px;overflow-wrap:anywhere}
h1 span{background:linear-gradient(90deg,var(--text),var(--a) 45%,var(--b));background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine-text 3s linear infinite}
@keyframes shine-text{to{background-position:200% center}}
.sub{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:22px;overflow-wrap:anywhere}
.sub:empty{display:none}
.members{display:inline-block;margin:-6px 0 20px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;color:var(--badge);background:var(--tile);border:1px solid var(--line)}
.members:empty{display:none}
#jbtn{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  min-height:64px;padding:17px 20px;border-radius:19px;color:var(--btn-text);font-size:18px;font-weight:900;line-height:1.2;text-decoration:none;text-align:center;overflow:hidden;overflow-wrap:anywhere;
  background:linear-gradient(105deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.5);-webkit-tap-highlight-color:transparent;
  box-shadow:0 12px 35px rgba(var(--a-rgb),.34),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .25s ease,box-shadow .25s ease;animation:pulse 2.5s ease-in-out infinite}
#jbtn:before{content:"";position:absolute;z-index:-1;top:0;left:-80%;width:55%;height:100%;transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 2.8s infinite}
@keyframes sweep{0%{left:-80%}55%,100%{left:140%}}
@keyframes pulse{50%{box-shadow:0 15px 45px rgba(var(--a-rgb),.5),0 0 22px rgba(var(--b-rgb),.2),inset 0 1px 0 rgba(255,255,255,.5)}}
#jbtn:hover{transform:translateY(-3px) scale(1.015)}
#jbtn:active{transform:scale(.975)}
#jbtn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
#jbtn.loading{pointer-events:none;opacity:.85;animation:none}
#jbtn svg{width:26px;height:26px;flex:none}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0 0}
.feature{padding:13px 4px;border-radius:15px;background:var(--tile);border:1px solid var(--line);transition:.3s ease}
.feature:hover{transform:translateY(-4px)}
.feature b{display:block;font-size:15px;font-weight:900;background:linear-gradient(90deg,var(--a),var(--b));
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;margin-bottom:3px;overflow-wrap:anywhere}
.feature span{font-size:9px;color:var(--faint);font-weight:800;letter-spacing:1px}
.footer{margin-top:19px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.7}
.petal-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}
.petal{position:absolute;top:-50px;width:14px;height:10px;border-radius:80% 15% 80% 15%;
  background:linear-gradient(135deg,#fff,var(--a));box-shadow:0 0 10px rgba(var(--a-rgb),.4);opacity:.7;animation:fall linear forwards}
.petal:nth-child(3n){width:11px;height:8px;background:linear-gradient(135deg,#fff,var(--b))}
@keyframes fall{
  0%{transform:translate3d(0,-60px,0) rotate(0);opacity:0}8%{opacity:.8}
  25%{transform:translate3d(35px,25vh,0) rotate(110deg)}
  50%{transform:translate3d(-25px,52vh,0) rotate(230deg)}
  75%{transform:translate3d(45px,78vh,0) rotate(320deg)}
  100%{transform:translate3d(-20px,112vh,0) rotate(450deg);opacity:0}
}
@media(max-width:390px){body{padding:10px}.container{padding:25px 17px 22px;border-radius:25px}.icon{width:105px;height:105px;font-size:44px}#jbtn{font-size:16px;min-height:60px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.petal-field{display:none}}
#aman-credit{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;font:600 11px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(12,14,24,.75);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);box-shadow:0 4px 14px -6px rgba(0,0,0,.6)}
#aman-credit .credit-icon{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;overflow:hidden;background:#0c2b30}
#aman-credit .credit-icon img{width:100%;height:100%;object-fit:cover;object-position:76% 28%}
#aman-credit strong{color:#fff}
</style>

  function isTelegram(url){ try { const u=new URL(url); return u.protocol==='https:' && ['t.me','telegram.me'].includes(u.hostname); } catch { return false; } }
  function record(event){
